[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conda-features"
version = "0.1.0"
description = "Discover and configure optional features from installed conda plugins"
requires-python = ">=3.12"
dependencies = ["conda>=26.9.4", "filelock>=3.16"]

[project.entry-points.conda]
conda-features = "conda_features.plugin"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = "3.12.*"
conda = "26.9.4.*"
filelock = ">=3.16"
pytest = ">=8"
ruff = ">=0.14"
ty = "*"
pip = "*"
hatchling = "*"

[tool.pixi.pypi-dependencies]
conda-features = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check ."
format-check = "ruff format --check ."
type-check = "ty check src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
