[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "conda-features"
version = "0.2.0"
description = "Discover and configure optional features from installed conda plugins"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["filelock>=3.16", "pluggy>=1.5"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]

[project.urls]
Homepage = "https://github.com/jezdez/conda-features"
Documentation = "https://jezdez.github.io/conda-features/"
Issues = "https://github.com/jezdez/conda-features/issues"

[project.entry-points.conda]
conda-features = "conda_features.plugin"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = "3.12.*"
conda = "26.9.4.*"
filelock = ">=3.16"
pluggy = ">=1.5"
pytest = ">=8"
ruff = ">=0.14"
ty = "*"
pip = "*"
hatchling = "*"

[tool.pixi.pypi-dependencies]
conda-features = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check ."
format-check = "ruff format --check ."
type-check = "ty check src"

[tool.pixi.feature.examples.pypi-dependencies]
conda-features-examples = { path = "packages/conda-features-examples", editable = true }

[tool.pixi.feature.examples.tasks]
test-examples = "pytest tests/test_examples.py"

[tool.pixi.feature.integration.dependencies]
conda-pypi = "0.13.*"
conda-rattler-solver = "26.10.*"
conda-completion = "0.3.2.*"

[tool.pixi.feature.integration.tasks]
test-integration = "pytest tests/test_examples.py"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=8"
myst-parser = ">=4"
conda-sphinx-theme = ">=0.3"
sphinx-design = ">=0.6"

[tool.pixi.feature.docs.tasks]
docs = "sphinx-build -W --keep-going -n -b dirhtml docs docs/_build/dirhtml"

[tool.pixi.feature.release.dependencies]
python = "3.12.*"
python-build = ">=1.2"
hatchling = ">=1.27"
twine = ">=6.2"
rattler-build = ">=0.74"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
examples = { features = ["examples"], solve-group = "default" }
integration = { features = ["examples", "integration"] }
docs = { features = ["docs"], solve-group = "default" }
release = { features = ["release"], no-default-feature = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
