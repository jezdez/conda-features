name: Check Anaconda secret availability

on:
  push:
    tags:
      - diagnose-anaconda.*

permissions: {}

concurrency:
  group: diagnose-anaconda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check protected environment secret
    runs-on: ubuntu-latest
    environment: anaconda
    steps:
      - name: Report presence only
        env:
          HAS_ANACONDA_KEY: ${{ secrets.ANACONDA_API_KEY != '' }}
        run: |
          if [ "$HAS_ANACONDA_KEY" = true ]; then
            echo 'Anaconda environment secret is present in a standalone job.'
          else
            echo '::error::Anaconda environment secret is empty in a standalone job.'
            exit 1
          fi
